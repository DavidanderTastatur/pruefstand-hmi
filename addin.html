<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prüfstand HMI</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#161617;overflow:hidden}
iframe{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;overflow:hidden}</style>
</head><body><iframe id="hmi" src="index.html?v=2" scrolling="no" title="HMI-Entwurf Prüfstand"></iframe>
<script>
(function(){
  var f=document.getElementById('hmi');
  function refit(){ try{ var w=f.contentWindow; if(w&&w.fit){ w.fit(); } }catch(e){} }
  f.addEventListener('load',function(){ refit(); setTimeout(refit,300); setTimeout(refit,1200); });
  window.addEventListener('resize',refit);
  if(window.ResizeObserver){ new ResizeObserver(refit).observe(document.documentElement); }
  document.addEventListener('visibilitychange',refit);
  setInterval(refit,1500);
  if(window.Office){ Office.onReady(function(){ refit(); }); }
})();
</script></body></html>
