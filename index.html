<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HMI-Entwurf Prüfstand</title>
<style>
:root{--bg:#333336;--bg2:#242426;--card:#3c3c3f;--tile:#545456;--tile2:#6a6a6e;--line:#5d5d61;--txt:#fff;--dim:#b9b9bd;--or:#ff7a0a;--blue:#0b3d91;--green:#41ac69;--red:#e0001a;--yel:#ffd400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#161617;overflow:hidden;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--txt)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;margin:-400px 0 0 -640px;transform-origin:center center;background:var(--bg);overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
img{image-rendering:auto}
.hdr{height:72px;flex:none;background:var(--tile);display:flex;align-items:center;gap:16px;padding:0 12px;border-bottom:3px solid var(--or)}
.hdr h1{margin:0;font-size:28px;font-weight:600;letter-spacing:.2px}
.hdr .sub{color:var(--dim);font-size:17px;margin-left:4px}
.hdr .sp{flex:1}
.sq{width:56px;height:56px;background:#2d2d2f;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #6b6b6f;cursor:pointer}
.sq:active{background:var(--tile2)}
.sq img{max-width:100%;max-height:100%}
.hicon{width:58px;height:58px;background:var(--tile);position:relative;flex:none;border:1px solid #707074}
.hicon .band{position:absolute;left:0;right:0;top:0;height:11px;background:var(--or)}
.hicon svg{position:absolute;left:0;top:10px;width:100%;height:calc(100% - 10px)}
.badge{font-size:15px;color:var(--dim);border:1px solid #707074;padding:4px 10px}
.foot{height:56px;flex:none;background:#2a2a2c;border-top:2px solid #4a4a4d;display:flex;align-items:center;padding:0 18px;gap:26px;font-size:16px;color:var(--dim)}
.foot .sp{flex:1}
.led{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:8px;vertical-align:-2px;background:var(--green);box-shadow:0 0 6px rgba(65,172,105,.7)}
.led.o{background:var(--or);box-shadow:0 0 6px rgba(255,122,10,.7)}

/* Hauptmenue */
.grid{flex:1;padding:12px 18px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:12px 16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 16px;cursor:pointer;min-height:0}
.card:active{background:#4b4b4f}
.ttile{width:112px;height:112px;background:var(--tile);position:relative;flex:none;border:1px solid #707074}
.ttile .band{position:absolute;left:0;right:0;top:0;height:27px;background:var(--or);color:#fff;font-size:16px;line-height:27px;text-align:center;letter-spacing:.6px;white-space:nowrap}
.ttile.blue .band{background:var(--blue)}
.ttile svg,.ttile img.mi{position:absolute;left:0;right:0;top:29px;width:100%;height:82px}
.ttile img.mi{object-fit:contain;width:76px;height:76px;left:18px;top:32px}
.ctext{flex:1;min-width:0}
.ctext h2{margin:0 0 5px;font-size:26px;font-weight:600}
.ctext p{margin:0;color:var(--dim);font-size:16.5px;line-height:1.3}
.ctext .ref{display:inline-block;margin-left:10px;font-size:14px;color:var(--or);font-weight:400;vertical-align:3px}
.ibtn{width:64px;height:64px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #707074;cursor:pointer}
.ibtn:active{background:var(--tile2)}
.ibtn img{width:55px;height:45px;transform:scale(1.15)}

/* Parameterseite */
.body{flex:1;display:flex;gap:16px;padding:14px 16px;min-height:0}
.lp{width:548px;flex:none;display:flex;flex-direction:column;gap:8px}
.rp{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.prow{display:flex;align-items:center;gap:10px;height:90px;background:var(--card);border:1px solid var(--line);padding:0 12px}
.plabel{width:178px;flex:none}
.plabel b{display:block;font-size:20px;font-weight:600;line-height:1.15}
.plabel span{display:block;font-size:13.5px;color:var(--dim);margin-top:3px}
.plabel span.pl{color:#ffb066}
.sbtn{width:64px;height:64px;flex:none;cursor:pointer;background:var(--tile);border:2px solid #fff;border-radius:7px;position:relative}
.sbtn:active{background:var(--tile2)}
.sbtn::before,.sbtn::after{content:"";position:absolute;background:#fff;left:50%;top:50%}
.sbtn::before{width:22px;height:3px;margin:-1.5px 0 0 -11px}
.sbtn.plus::after{width:3px;height:22px;margin:-11px 0 0 -1.5px}
.vbox{width:128px;height:64px;background:#262628;border-bottom:4px solid var(--or);display:flex;align-items:center;justify-content:flex-end;padding:0 12px;font-size:30px;cursor:pointer;font-variant-numeric:tabular-nums}
.vbox.err{border-bottom-color:var(--red);color:#ff8d8d}
.unit{width:48px;font-size:19px;color:var(--dim);flex:none}
.seg{display:flex;gap:8px}
.segb{flex:1;height:84px;background:var(--tile);position:relative;cursor:pointer;border:1px solid #707074;text-align:center}
.segb .t{position:absolute;left:0;right:0;top:0;height:24px;line-height:24px;font-size:15px;background:#707074}
.segb.on .t{background:var(--or)}
.segb svg{position:absolute;left:8px;right:8px;top:26px;width:calc(100% - 16px);height:56px}
.segrow{background:var(--card);border:1px solid var(--line);padding:10px 12px 12px}
.segrow>b{display:block;font-size:20px;font-weight:600;margin-bottom:8px}
.dia{background:#2a2a2d;border:1px solid var(--line);flex:1;display:flex;flex-direction:column;min-height:0}
.dia .dh{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid #444;font-size:16px;color:var(--dim);gap:10px}
.dia .dh b{color:#fff;font-weight:600;font-size:18px}
.dia .dh .sp{flex:1}
.dia svg{display:block;width:100%;height:100%}
.msg{height:62px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;font-size:17px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--green)}
.msg.warn{border-left-color:var(--yel)}
.msg.bad{border-left-color:var(--red);background:#442428}
.msg img{width:40px;height:auto}
.bar{height:112px;flex:none;background:#2a2a2c;border-top:2px solid #4a4a4d;display:flex;align-items:center;padding:0 16px;gap:14px}
.bar .sp{flex:1}
.bar img{display:block;cursor:pointer}
.bar img.big{width:92px;height:92px}
.bar img.dis{opacity:.28;filter:grayscale(1);pointer-events:none}
.bar .st{font-size:16px;color:var(--dim);text-align:right;line-height:1.5}

/* Anlagenparameter */
.tabs{display:flex;gap:8px;padding:12px 16px 0}
.tab{height:62px;padding:0 26px;background:var(--tile);border:1px solid #707074;border-top:7px solid #707074;font-size:21px;display:flex;align-items:center;cursor:pointer}
.tab.on{background:var(--tile2);border-top-color:var(--or)}
.card2{background:var(--card);border:1px solid var(--line);padding:12px 14px}
.card2 h3{margin:0 0 10px;font-size:19px;font-weight:600;color:#fff}
.card2 h3 span{color:var(--dim);font-weight:400;font-size:15px;margin-left:8px}
.der{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-size:18px}
.der div:nth-child(odd){color:var(--dim)}
.der div:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.der b{color:var(--or);font-weight:600}
.note{font-size:14.5px;color:var(--dim);line-height:1.4;margin-top:10px}
.chip{display:inline-flex;height:52px;align-items:center;padding:0 22px;background:var(--tile);border:1px solid #707074;border-top:6px solid #707074;font-size:19px;cursor:pointer}
.chip.on{background:var(--tile2);border-top-color:var(--or)}
.stage-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tiny{font-size:14px;color:var(--dim)}

/* Overlays */
.ov{position:absolute;inset:0;background:rgba(10,10,12,.72);display:none;z-index:20}
.ov.on{display:block}
.modal{position:absolute;left:150px;top:80px;width:980px;height:620px;background:var(--bg);border:2px solid var(--or);display:flex;flex-direction:column}
.modal .mh{height:72px;background:var(--tile);display:flex;align-items:center;gap:16px;padding:0 14px;flex:none}
.modal .mh h2{margin:0;font-size:27px;font-weight:600}
.modal .mb{flex:1;display:flex;gap:18px;padding:18px;min-height:0}
.modal .mt{width:420px;flex:none}
.modal h4{margin:0 0 6px;font-size:16px;color:var(--or);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.modal p{margin:0 0 16px;font-size:19px;line-height:1.38}
.modal .chips span{display:inline-block;margin:0 8px 8px 0;padding:6px 12px;background:var(--tile);border:1px solid #707074;font-size:16px}
.modal .md{flex:1;background:#2a2a2d;border:1px solid var(--line);min-width:0}
.modal .md svg{width:100%;height:100%}
.modal .mf{height:96px;flex:none;border-top:2px solid #4a4a4d;background:#2a2a2c;display:flex;align-items:center;gap:14px;padding:0 16px}
.modal .mf .sp{flex:1}
.btn{height:64px;padding:0 28px;display:flex;align-items:center;gap:12px;font-size:21px;background:var(--tile);border:1px solid #707074;cursor:pointer}
.btn.or{background:var(--or);border-color:var(--or);font-weight:600}
.btn img{height:44px;width:auto}
.np{position:absolute;right:0;top:0;bottom:0;width:372px;background:var(--bg);border-left:2px solid var(--or);padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.np .nl{font-size:19px;color:var(--dim)}
.np .nd{height:70px;background:#262628;border-bottom:4px solid var(--or);font-size:36px;display:flex;align-items:center;justify-content:flex-end;padding:0 14px}
.np .nr{font-size:15px;color:var(--dim);min-height:20px}
.np .keys{display:grid;grid-template-columns:repeat(3,91px);gap:9px;justify-content:center;margin-top:4px}
.np .keys img{width:91px;height:91px;cursor:pointer}
.np .keys img:active{filter:brightness(1.4)}
.np .keys .kx{width:91px;height:91px;background:var(--tile);display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer}
.np .acts{display:flex;gap:9px;justify-content:center;margin-top:auto}
.np .acts img{width:91px;height:91px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:#111;border:1px solid var(--or);padding:12px 22px;font-size:18px;z-index:40;display:none}
.toast.on{display:block}
svg text{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
</style>
</head>
<body>
<div id="stage">

  <!-- HAUPTMENUE -->
  <section class="screen on" id="s-main">
    <div class="hdr">
      <h1>Lastsimulations- und Funktionsprüfstand</h1><span class="sub">Prüfung auswählen</span>
      <div class="sp"></div>
      <span class="badge">Konzeptentwurf</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">
      <span><i class="led"></i>Wellenabdeckung geschlossen</span>
      <span><i class="led"></i>Not-Halt freigegeben</span>
      <div class="sp"></div>
      <span id="foot-lim"></span>
    </div>
  </section>

  <!-- PARAMETERSEITE -->
  <section class="screen" id="s-mode">
    <div class="hdr" id="m-hdr"></div>
    <div class="body">
      <div class="lp" id="m-params"></div>
      <div class="rp">
        <div class="dia"><div class="dh"><b>Darstellung</b><span id="m-diasub"></span><div class="sp"></div><span>ändert sich mit den Parametern</span></div><div id="m-svg" style="flex:1;min-height:0"></div></div>
        <div class="msg" id="m-msg"></div>
      </div>
    </div>
    <div class="bar" id="m-bar"></div>
  </section>

  <!-- ANLAGENPARAMETER -->
  <section class="screen" id="s-plant">
    <div class="hdr" id="p-hdr"></div>
    <div class="tabs" id="p-tabs"></div>
    <div class="body" id="p-body" style="padding-top:14px"></div>
    <div class="bar" id="p-bar"></div>
  </section>

  <!-- INFO -->
  <div class="ov" id="ov-info"><div class="modal" id="info"></div></div>
  <!-- NUMPAD -->
  <div class="ov" id="ov-np"><div class="np" id="np"></div></div>
  <div class="toast" id="toast"></div>
</div>

const MODE = id => MODES.find(m=>m.id===id);
const S = {vals:{},seg:{}};
function resetMode(m){ S.vals[m.id]={}; m.params.forEach(p=>S.vals[m.id][p.k]=p.def); if(m.seg) S.seg[m.id]=m.seg.def; }
MODES.forEach(resetMode);

/* ---------- Hauptmenue ---------- */
function tileHTML(m){
  const inner = m.img ? `<img class="mi" src="${IMG[m.img]}">` : MI[m.id];
  return `<div class="ttile ${m.blue?'blue':''}"><div class="band">${m.band}</div>${inner}</div>`;
}
function buildMain(){
  $('#grid').innerHTML = MODES.map(m=>`
    <div class="card" data-m="${m.id}">
      ${tileHTML(m)}
      <div class="ctext"><h2>${m.name}${m.ref?`<span class="ref">${m.ref}</span>`:''}</h2><p>${m.desc}</p></div>
      <div class="ibtn" data-i="${m.id}"><img src="${IMG.icon_info}"></div>
    </div>`).join('');
  document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>{
    if(e.target.closest('.ibtn')) { openInfo(e.target.closest('.ibtn').dataset.i); return; }
    go(c.dataset.m);
  }));
  const L=lim();
  $('#foot-lim').innerHTML = `Lastgrenze aus Anlagenparametern: <b style="color:#fff">${fmt(L.Mmax,1)} Nm</b> &nbsp;·&nbsp; Beispielwerte`;
}

/* ---------- Navigation ---------- */
let cur='main', curMode=null, plantTab='P';
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('#s-'+id).classList.add('on'); }
function go(id){
  closeOv();
  if(id==='main'){ cur='main'; buildMain(); show('main'); return; }
  if(id==='plant'){ cur='plant'; renderPlant(); show('plant'); return; }
  cur='mode'; curMode=id; renderMode(); show('mode');
}
function closeOv(){ $('#ov-info').classList.remove('on'); $('#ov-np').classList.remove('on'); }
let toastT; function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('on'),2200); }

/* ---------- Info ---------- */

  const m=MODE(id);

  $('#info').innerHTML = `
    <div class="mh">${m.id==='plant'?'':''}<div class="hicon" style="${m.blue?'':''}"><div class="band" style="${m.blue?'background:var(--blue)':''}"></div>${m.img?`<img src="${IMG[m.img]}" style="position:absolute;left:0;top:8px;width:56px;height:50px;object-fit:contain">`:MI[m.id]}</div>
      <h2>${m.name}</h2><span class="tiny">${m.ref?'Lastenheft '+m.ref:''}</span><div style="flex:1"></div>
      <div class="sq" onclick="closeOv()"><img src="${IMG.cancel}"></div></div>
    <div class="mb">

        <h4>Wofür?</h4><p>${m.use}</p>

      </div>

    <div class="mf"><div class="sp"></div>
      <div class="btn" onclick="closeOv()">Schließen</div>
      <div class="btn or" onclick="go('${m.id}')">${m.id==='plant'?'Zu den Anlagenparametern':'Zur Prüfung'}</div></div>`;

  $('#ov-info').classList.add('on');

/* ---------- Pruefart-Seite ---------- */
function paramRow(m,p){
  const v = S.vals[m.id][p.k], mx=p.max(), bad = v<p.min-1e-9||v>mx+1e-9;
  return `<div class="prow">
    <div class="plabel"><b>${p.label}</b><span class="${p.pl?'pl':''}">${fmt(p.min,p.dec)} … ${fmt(mx,p.dec)} ${p.unit}${p.pl?' · aus Anlage':''}</span></div>
    <div class="sbtn" data-s="${p.k}" data-d="-1"></div>
    <div class="vbox ${bad?'err':''}" data-v="${p.k}">${fmt(v,p.dec)}</div>
    <div class="sbtn plus" data-s="${p.k}" data-d="1"></div>
    <div class="unit">${p.unit}</div></div>`;
}
function renderMode(){
  const m=MODE(curMode);
  // clamp stored values to current limits
  m.params.forEach(p=>{ S.vals[m.id][p.k]=clamp(S.vals[m.id][p.k],p.min,p.max()); });
  const icon = m.img?`<img src="${IMG[m.img]}" style="position:absolute;left:0;top:8px;width:56px;height:50px;object-fit:contain">`:MI[m.id];
  $('#m-hdr').innerHTML = `<div class="sq" id="b-back"><img src="${IMG.navigate_left}"></div>
    <div class="hicon"><div class="band"></div>${icon}</div>
    <h1>${m.name}</h1><span class="sub">${m.ref?'Lastenheft '+m.ref:''}</span><div class="sp"></div>
    <div class="ibtn" id="b-info" style="width:56px;height:56px"><img src="${IMG.icon_info}"></div>`;
  $('#b-back').onclick=()=>go('main'); $('#b-info').onclick=()=>openInfo(m.id);
  let html='';
  if(m.seg){
    html += `<div class="segrow"><b>${m.seg.label}</b><div class="seg">${m.seg.opts.map(o=>`
      <div class="segb ${S.seg[m.id]===o.v?'on':''}" data-sg="${o.v}"><div class="t">${o.t}</div>${WF[o.v]||''}</div>`).join('')}</div></div>`;
  }
  html += m.params.map(p=>paramRow(m,p)).join('');
  $('#m-params').innerHTML = html;
  $('#m-params').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const p=m.params.find(x=>x.k===b.dataset.s); const d=+b.dataset.d;
    setVal(m,p, +(S.vals[m.id][p.k]+d*p.step).toFixed(4));
  });
  $('#m-params').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>openNumpad(m,m.params.find(x=>x.k===b.dataset.v)));
  $('#m-params').querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{ S.seg[m.id]=b.dataset.sg; renderMode(); });
  drawMode();
}
function setVal(m,p,v){
  const mx=p.max(); const c=clamp(v,p.min,mx);
  if(Math.abs(c-v)>1e-9) toast(`Wert auf Grenze begrenzt (${fmt(p.min,p.dec)} … ${fmt(mx,p.dec)} ${p.unit})`);
  S.vals[m.id][p.k]=+c.toFixed(4); renderMode();
}
function check(m){
  const v=S.vals[m.id], L=lim(); const out={lvl:'ok',txt:'Alle Werte liegen innerhalb der Grenzen.'};
  const bad=(t)=>{out.lvl='bad';out.txt=t;};
  if(m.id==='dyn'){
    const dM=v.Mo-v.Mu, c=S.seg[m.id];
    if(v.Mu>=v.Mo){ bad('Untere Grenze muss kleiner als die obere Grenze sein.'); return out; }
    const rate = c==='sin' ? Math.PI*v.f*dM : c==='tri' ? 2*v.f*dM : 10*v.f*dM;
    out.rate=rate;
    if(rate>SLEW){ bad(`Momentenänderung ${fmt(rate,1)} Nm/s ist zu hoch (max. ${fmt(SLEW,0)} Nm/s). Frequenz oder Schwankung verringern.`); return out; }
    out.txt=`Alle Werte innerhalb der Grenzen. Max. Momentenänderung ${fmt(rate,1)} Nm/s (zulässig ${fmt(SLEW,0)} Nm/s).`;
  }
  if(m.id==='brems'){
    if(!plant.P.br){ bad('Laut Anlagenparametern hat der Prüfmotor keine Bremse.'); return out; }
    out.txt=`Haltemoment der Bremse laut Anlagenparametern: ${fmt(L.Mbrake,1)} Nm an der Zentralwelle.`;
    if(v.M>L.Mbrake){ out.lvl='warn'; out.txt=`Prüfmoment liegt über dem Haltemoment der Bremse (${fmt(L.Mbrake,1)} Nm). Bremse muss rutschen.`; }
  }
  if(m.id==='dauer') out.txt=`Dauerlast bis zum Nennmoment (${fmt(L.Mnenn,1)} Nm). Gesamtlaufzeit: ${fmt(v.tz*v.n+v.tp/60*(v.n-1),1)} h.`;
  if(m.id==='uebern'||m.id==='brems'||m.id==='ew'||m.id==='stat'||m.id==='hang'){
    if(out.lvl==='ok'&&m.id==='stat') out.txt=`Alle Werte innerhalb der Grenzen. Dauer eines Durchlaufs: ${fmt(2*v.tr+v.th,0)} s.`;
  }
  return out;
}
function drawMode(){
  const m=MODE(curMode), v=S.vals[m.id], c=S.seg[m.id];
  $('#m-svg').innerHTML = diagram(m.id,v,c,false);
  $('#m-diasub').textContent = ['stat','uebern','brems','dauer','hang'].includes(m.id)?'schematisch':'';
  const r=check(m);
  const ic = r.lvl==='ok'?IMG.matrix_test_key_26:r.lvl==='warn'?IMG.icon_error:IMG.error_icon_error;
  $('#m-msg').className='msg'+(r.lvl==='warn'?' warn':r.lvl==='bad'?' bad':'');
  $('#m-msg').innerHTML = `<img src="${ic}" style="width:36px;height:36px;object-fit:contain"><span>${r.txt}</span>`;
  const dis = r.lvl==='bad';
  $('#m-bar').innerHTML = `
    <img class="big ${dis?'dis':''}" id="b-start" src="${IMG.matrix_test_key_01}">
    <img class="big" id="b-stop" src="${IMG.matrix_test_key_02}">
    <div style="width:18px"></div>
    <img id="b-def" src="${IMG.archiv_setdefault}"><img id="b-load" src="${IMG.archiv_load_active}"><img id="b-save" src="${IMG.archiv_save_active}">
    <div class="sp"></div>
    <div class="st">Lastgrenze: <b style="color:#fff">${fmt(lim().Mmax,1)} Nm</b> aus Anlagenparametern<br><span style="color:#ffb066">Entwurf – keine Funktion hinterlegt</span></div>`;
  $('#b-start').onclick=()=>toast('Start (Entwurf: keine Funktion)');
  $('#b-stop').onclick=()=>toast('Stopp (Entwurf: keine Funktion)');
  $('#b-def').onclick=()=>{ resetMode(m); renderMode(); toast('Standardwerte geladen'); };
  $('#b-load').onclick=()=>toast('Rezept laden (Entwurf)'); $('#b-save').onclick=()=>toast('Rezept speichern (Entwurf)');
}

/* ---------- Numpad ---------- */
let npCtx=null, npBuf='';
function openNumpad(m,p,custom){
  npCtx = custom||{m,p}; npBuf='';
  const p2 = custom?custom.p:p;
  const mx = p2.max?p2.max():p2.maxv;
  const cur = custom?custom.get():S.vals[m.id][p.k];
  $('#np').innerHTML = `<div class="nl">${p2.label} [${p2.unit}]</div><div class="nd" id="np-d">${fmt(cur,p2.dec)}</div>
    <div class="nr">Bereich: ${fmt(p2.min,p2.dec)} … ${fmt(mx,p2.dec)} ${p2.unit}</div>
    <div class="keys">${[7,8,9,4,5,6,1,2,3].map(n=>`<img data-k="${n}" src="${IMG['n'+n]}">`).join('')}
      <img data-k="," src="${IMG.ncomma}"><img data-k="0" src="${IMG.n0}"><div class="kx" data-k="del">⌫</div></div>
    <div class="acts"><img id="np-cancel" src="${IMG.cancel}"><img id="np-ok" src="${IMG.ok}"></div>`;
  $('#np').querySelectorAll('[data-k]').forEach(k=>k.onclick=()=>{
    const c=k.dataset.k;
    if(c==='del') npBuf=npBuf.slice(0,-1); else if(c===','){ if(!npBuf.includes(',')) npBuf+=(npBuf===''?'0,':','); } else if(npBuf.replace(',','').length<7) npBuf+=c;
    $('#np-d').textContent = npBuf===''?'0':npBuf;
  });
  $('#np-cancel').onclick=()=>$('#ov-np').classList.remove('on');
  $('#np-ok').onclick=()=>{
    $('#ov-np').classList.remove('on');
    if(npBuf==='') return;
    const v=parseFloat(npBuf.replace(',','.'));
    if(custom) custom.set(v); else setVal(m,p,v);
  };
  $('#ov-np').classList.add('on');
}

      <div class="stage-row"><span class="chip ${o.direct?'on':''}" data-dir="${key}:1">Direktkupplung</span><span class="chip ${!o.direct?'on':''}" data-dir="${key}:0">Zahnradstufe</span>
      <span style="font-size:21px;margin-left:14px">i = <b style="color:var(--or)">${fmt(ratio(o),2)}</b></span></div>
      ${o.direct?'':`<div style="margin-top:8px">${ZFIELDS.map(f=>prow2(o,f,key)).join('')}</div>`}</div>`; };
    left = st('iP','Prüfmotor → Zentralwelle','Welle / Zahnradstufe') + st('iG','Gegenmotor → Zentralwelle','Welle / Zahnradstufe');
  }
  const der = `<div class="card2"><h3>Abgeleitete Werte <span>an der Zentralwelle</span></h3><div class="der">
     <div>Max. Lastmoment (Gegenmotor)</div><div><b>${fmt(L.Mmax,1)} Nm</b></div>
     <div>Dauerlast bis (Nennmoment)</div><div>${fmt(L.Mnenn,1)} Nm</div>
     <div>Haltemoment Bremse (Prüfmotor)</div><div>${plant.P.br?fmt(L.Mbrake,1)+' Nm':'keine Bremse'}</div>
     <div>Max. Drehzahl Zentralwelle</div><div>${fmt(L.nmax,0)} min⁻¹</div></div>
     <div class="note">Moment an der Zentralwelle = Motormoment · i (ideal, ohne Wirkungsgrad).<br>Drehzahl an der Zentralwelle = Motordrehzahl / i.<br>Aus diesen Werten ergeben sich die einstellbaren Grenzen aller Prüfarten.</div></div>`;
  $('#p-body').innerHTML = `<div class="lp" style="width:600px">${left}</div>
    <div class="rp"><div class="dia"><div class="dh"><b>Anlage</b><span>schematisch</span></div><div style="flex:1;min-height:0">${plantSchema(false)}</div></div>${der}</div>`;
  $('#p-body').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{
    const f=[...PFIELDS,BFIELD,...ZFIELDS].find(x=>x.k===b.dataset.f), o=objOf(b.dataset.o);
    o[f.k]=+clamp(o[f.k]+ +b.dataset.d*f.step,f.min,f.maxv).toFixed(3); renderPlant();
  });
  $('#p-body').querySelectorAll('.vbox[data-f]').forEach(b=>b.onclick=()=>{
    const f=[...PFIELDS,BFIELD,...ZFIELDS].find(x=>x.k===b.dataset.f), o=objOf(b.dataset.o);
    openNumpad(null,null,{p:f,get:()=>o[f.k],set:v=>{o[f.k]=+clamp(v,f.min,f.maxv).toFixed(3);renderPlant();}});
  });
  $('#p-body').querySelectorAll('[data-br]').forEach(b=>b.onclick=()=>{plant.P.br=b.dataset.br==='1';renderPlant();});
  $('#p-body').querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{const [k,d]=b.dataset.dir.split(':');objOf(k).direct=d==='1';renderPlant();});
  $('#p-bar').innerHTML = `<img class="big" src="${IMG.ok}" id="p-ok" style="width:92px;height:92px"><img src="${IMG.cancel}" style="width:92px;height:92px" id="p-cancel"><div style="width:18px"></div>
    <img src="${IMG.archiv_setdefault}" id="p-def"><img src="${IMG.archiv_load_active}"><img src="${IMG.archiv_save_active}"><div class="sp"></div>
    <div class="st">Änderungen wirken auf die Grenzen aller Prüfarten<br><span style="color:#ffb066">Beispielwerte – keine Hardware-Daten</span></div>`;
  $('#p-ok').onclick=()=>{toast('Übernommen');go('main');}; $('#p-cancel').onclick=()=>go('main');
  $('#p-def').onclick=()=>{plant=DEF_PLANT();renderPlant();toast('Beispielwerte geladen');};
}

/* ---------- Zeichenhilfen ---------- */
function gearPath(cx,cy,ro,ri,n,rot=0){
  let d=''; const st=2*Math.PI/n;
  for(let k=0;k<n;k++){
    const a=rot+k*st, pts=[[a-st*.30,ri],[a-st*.17,ro],[a+st*.17,ro],[a+st*.30,ri]];
    pts.forEach((p,i)=>{ d+=(k===0&&i===0?'M':'L')+(cx+p[1]*Math.cos(p[0])).toFixed(1)+' '+(cy+p[1]*Math.sin(p[0])).toFixed(1)+' '; });
  } return d+'Z';
}
const W='#fff', OR='#ff7a0a', DIM='#9a9aa0';
function defs(){ return `<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker>
 <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7a0a"/></marker></defs>`; }
function T(x,y,s,o={}){ return `<text x="${x}" y="${y}" fill="${o.c||'#fff'}" font-size="${o.s||17}" text-anchor="${o.a||'start'}" ${o.w?`font-weight="${o.w}"`:''} ${o.r?`transform="rotate(${o.r} ${x} ${y})"`:''}>${s}</text>`; }
function dim(x1,y1,x2,y2,label,lx,ly,o={}){
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c||W}" stroke-width="2" marker-start="url(#${o.c?'ao':'ah'})" marker-end="url(#${o.c?'ao':'ah'})"/>`+T(lx,ly,label,{a:o.a||'middle',c:o.c||W,s:o.s||16});
}
/* Rahmen fuer M(t)-Diagramme */
function frame(L,big){
  const W0=720,H=440, l=82,r=690,t=44,b=336;
  const Y=m=>b-(m/L)*(b-t-26);
  let s=`<svg viewBox="0 0 ${W0} ${H}" preserveAspectRatio="xMidYMid meet" xmlns="${NS}">${defs()}`;
  s+=`<line x1="${l}" y1="${b}" x2="${r+6}" y2="${b}" stroke="#fff" stroke-width="2.5" marker-end="url(#ah)"/><line x1="${l}" y1="${b}" x2="${l}" y2="${t-18}" stroke="#fff" stroke-width="2.5" marker-end="url(#ah)"/>`;
  s+=T(r+6,b+24,'t',{a:'end',c:DIM})+T(l+12,t-6,'M [Nm]',{c:DIM,s:16});
  s+=`<line x1="${l}" y1="${Y(L)}" x2="${r}" y2="${Y(L)}" stroke="${OR}" stroke-width="1.6" stroke-dasharray="8 6" opacity=".8"/>`+T(r,Y(L)-8,`Lastgrenze ${fmt(L,1)} Nm`,{a:'end',c:OR,s:15});
  s+=T(l-10,b+5,'0',{a:'end',c:DIM,s:15});
  return {s,Y,l,r,t,b};
}
function poly(pts,c=OR,w=3.5,extra=''){ return `<polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="round" ${extra}/>`; }

function diagram(id,v,seg,small){
  const L=lim().Mmax;
  if(id==='stat'||id==='uebern'||id==='brems') return diaRamp(id,v,L);
  if(id==='dyn') return diaDyn(v,seg,L);
  if(id==='dauer') return diaDauer(v,lim().Mnenn);
  if(id==='hang') return diaHang(v,seg);
  if(id==='ew') return diaEW(v);
  return '';
}
function diaRamp(id,v,L){
  const F=frame(L), Y=F.Y, b=F.b; let s=F.s; const M = id==='uebern'?v.dM:v.M;
  const x0=F.l+20; const wr = id==='uebern'?24:96, wh=id==='uebern'?150:230, gap=40;
  let pts=[], px=x0; pts.push([px,Y(0)]); const cycles = id==='stat'?1:2;
  const marks=[];
  for(let c=0;c<cycles;c++){
    const xs=px; px+=wr; const xh=px; px+=wh; const xe=px; px+=wr;
    if(c===0) marks.push({xs,xh,xe,xd:px});
    pts.push([xs,Y(0)],[xh,Y(M)],[xe,Y(M)],[px,Y(0)]); px+=gap; pts.push([px-gap+0,Y(0)]);
  }
  s+=poly(pts.slice(0,-1)); // ohne letzten Verbinder
  if(cycles>1){ s+=T(px-gap+8,Y(M/2),'× '+v.n,{c:OR,s:20,w:600}); }
  const mk=marks[0];
  // Lastmoment-Pfeil
  s+=`<line x1="${mk.xh+16}" y1="${Y(0)}" x2="${mk.xh+16}" y2="${Y(M)}" stroke="#fff" stroke-width="2" marker-start="url(#ah)" marker-end="url(#ah)"/>`;
  s+=T(mk.xh+26,(Y(0)+Y(M))/2+6,(id==='uebern'?'ΔM = ':'M = ')+fmt(M,1)+' Nm',{s:18,w:600});
  // Zeitmarken unter der Achse
  s+=dim(mk.xs,b+24,mk.xh,b+24,'Anstiegszeit '+fmt(v.tr,id==='uebern'?2:1)+' s',mk.xs-14,b+50,{a:'start'});
  s+=dim(mk.xh,b+24,mk.xe,b+24,'Haltezeit '+fmt(v.th,0)+' s',(mk.xh+mk.xe)/2,b+74);
  if(id==='uebern') s+=T((mk.xh+mk.xe)/2,Y(M)-14,'Prüfmotor übernimmt und hält',{a:'middle',c:OR,s:16});
  if(id==='stat') s+=T((mk.xh+mk.xe)/2,Y(M)-14,'Gegenmotor hält Moment konstant',{a:'middle',c:OR,s:16});
  if(id==='brems'){
    s+=T((mk.xh+mk.xe)/2,Y(M)-14,'Bremse hält gegen Prüfmoment',{a:'middle',c:OR,s:16});
    s+=`<rect x="${x0}" y="${b+84}" width="${px-gap-x0}" height="14" fill="#444"/><rect x="${mk.xs}" y="${b+84}" width="${mk.xd-gap/2-mk.xs}" height="14" fill="${OR}"/>`;
    s+=T(F.l-10,b+96,'Bremse zu',{a:'end',c:DIM,s:13});
  }
  return s+'</svg>';
}
function waveVal(c,u){ // u in [0,1) Phase, start im Minimum, Rueckgabe 0..1
  if(c==='sin') return .5-.5*Math.cos(2*Math.PI*u);
  if(c==='tri') return u<.5?2*u:2-2*u;
  return u<.9?u/.9:(1-u)/.1;
}
function diaDyn(v,c,L){
  const F=frame(L), Y=F.Y, b=F.b; let s=F.s;
  const periods=2.5, W=F.r-F.l-30, Tp=W/periods; const pts=[];
  for(let i=0;i<=400;i++){ const t=i/400*periods; const u=t%1; const val=v.Mu+(v.Mo-v.Mu)*waveVal(c,u); pts.push([F.l+10+t*Tp,Y(val)]); }
  // Hilfslinien
  s+=`<line x1="${F.l}" y1="${Y(v.Mo)}" x2="${F.r}" y2="${Y(v.Mo)}" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 5" opacity=".6"/><line x1="${F.l}" y1="${Y(v.Mu)}" x2="${F.r}" y2="${Y(v.Mu)}" stroke="#fff" stroke-width="1.2" stroke-dasharray="3 5" opacity=".6"/>`;
  s+=poly(pts);
  s+=T(F.l-10,Y(v.Mo)+5,fmt(v.Mo,1),{a:'end',s:15})+T(F.l-10,Y(v.Mu)+5,fmt(v.Mu,1),{a:'end',s:15});
  const pk = c==='saw'?.9:.5; const xPk=F.l+10+pk*Tp, xPk2=F.l+10+(1+pk)*Tp;
  s+=`<line x1="${xPk+34}" y1="${Y(v.Mu)}" x2="${xPk+34}" y2="${Y(v.Mo)}" stroke="${OR}" stroke-width="2.2" marker-start="url(#ao)" marker-end="url(#ao)"/>`;
  s+=`<rect x="${xPk+40}" y="${(Y(v.Mu)+Y(v.Mo))/2-14}" width="140" height="50" fill="#2a2a2d"/>`+T(xPk+44,(Y(v.Mu)+Y(v.Mo))/2+6,'Schwankung',{c:OR,s:17})+T(xPk+44,(Y(v.Mu)+Y(v.Mo))/2+27,'ΔM = '+fmt(v.Mo-v.Mu,1)+' Nm',{c:OR,s:17});
  const ya=Math.min(Y(v.Mo)-26,Y(v.Mo)-26);
  s+=`<line x1="${xPk}" y1="${Y(v.Mo)-4}" x2="${xPk}" y2="${ya-6}" stroke="#fff" stroke-width="1" stroke-dasharray="3 3"/><line x1="${xPk2}" y1="${Y(v.Mo)-4}" x2="${xPk2}" y2="${ya-6}" stroke="#fff" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=dim(xPk,ya,xPk2,ya,'Periodendauer T = '+fmt(1/v.f,1)+' s  (f = '+fmt(v.f,2)+' Hz)',(xPk+xPk2)/2,ya-8);
  s+=T(F.l+10,b+34,{sin:'Sinus',tri:'Dreieck',saw:'Sägezahn'}[c]+' · '+fmt(v.tl,0)+' min Laufzeit',{c:DIM,s:16});
  return s+'</svg>';
}
function diaDauer(v,Mn){
  const F=frame(Mn), Y=F.Y, b=F.b; let s=F.s; const M=v.M;
  const rw=150, pw=70; let x=F.l+16; const pts=[]; const cyc=3;
  for(let c=0;c<cyc;c++){ pts.push([x,Y(0)],[x+8,Y(M)],[x+rw-8,Y(M)],[x+rw,Y(0)]); if(c<cyc-1){ pts.push([x+rw+pw,Y(0)]); } x+=rw+pw; }
  s+=poly(pts);
  const x1=F.l+16; s+=dim(x1+8,b+26,x1+rw-8,b+26,'Laufzeit '+fmt(v.tz,1)+' h',x1+rw/2,b+52);
  s+=dim(x1+rw,b+26,x1+rw+pw,b+26,'Pause',x1+rw+pw/2,b+52);
  s+=T(x1+rw/2,Y(M)-12,fmt(M,1)+' Nm',{a:'middle',c:OR,s:18,w:600});
  s+=T(F.r,Y(M)-12,'× '+v.n+' Zyklen',{a:'end',c:OR,s:20,w:600});
  s+=T(F.l+4,b+84,'Pause zwischen den Zyklen: '+fmt(v.tp,0)+' min',{c:DIM,s:16});
  return s+'</svg>';
}
function diaHang(v,dir){
  const cx=330, cy=150; const flip = dir==='L'?-1:1;
  let s=`<svg viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet" xmlns="${NS}">${defs()}`;
  s+=`<rect x="70" y="112" width="130" height="76" fill="none" stroke="#fff" stroke-width="3"/>`+T(135,156,'Prüfmotor',{a:'middle',s:18});
  s+=`<line x1="200" y1="150" x2="${cx-60}" y2="150" stroke="#fff" stroke-width="3"/>`;
  s+=`<circle cx="${cx}" cy="${cy}" r="62" fill="none" stroke="#fff" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="42" fill="none" stroke="#fff" stroke-width="2" opacity=".6"/><circle cx="${cx}" cy="${cy}" r="7" fill="${OR}"/>`;
  s+=T(cx,cy-76,'Seiltrommel',{a:'middle',s:16,c:DIM});
  // Seil + Gewicht (Seil rechts bei R, links bei L)
  const rx = cx+62*flip;
  s+=`<line x1="${rx}" y1="${cy}" x2="${rx}" y2="318" stroke="#fff" stroke-width="3"/>`;
  s+=`<rect x="${rx-52}" y="318" width="104" height="74" fill="#444" stroke="${OR}" stroke-width="3"/>`+T(rx,364,'Last',{a:'middle',s:20,w:600});
  s+=`<line x1="${rx+flip*78}" y1="330" x2="${rx+flip*78}" y2="390" stroke="#fff" stroke-width="2.5" marker-end="url(#ah)"/>`+T(rx+flip*88,366,'Gewichts-',{a:flip>0?'start':'end',s:15,c:DIM})+T(rx+flip*88,384,'kraft',{a:flip>0?'start':'end',s:15,c:DIM});
  // Momentpfeil
  const a0=-2.5, a1=-0.35; const R=86; const px=(a)=>[cx+R*Math.cos(a)*flip,cy+R*Math.sin(a)];
  const p0=px(flip>0?a0:a1), p1=px(flip>0?a1:a0);
  // Pfeil am Seilabgang vorbei: Lastmoment in Richtung der Last
  s+=`<path d="M ${cx+R*flip*Math.cos(-0.5)} ${cy+R*Math.sin(-0.5)} A ${R} ${R} 0 0 ${flip>0?1:0} ${cx+R*flip*Math.cos(0.9)} ${cy+R*Math.sin(0.9)}" fill="none" stroke="${OR}" stroke-width="4" marker-end="url(#ao)"/>`;
  s+=T(flip>0?cx+R+16:cx-R-16,cy-34,'M',{c:OR,s:24,w:700,a:flip>0?'start':'end'})+T(flip>0?cx+R+16:cx-R-16,cy-10,fmt(v.M,1)+' Nm',{c:OR,s:20,w:600,a:flip>0?'start':'end'});
  s+=T(40,262,'Das Lastmoment wirkt immer',{s:17,c:DIM})+T(40,284,'in dieselbe Richtung (Schwerkraft).',{s:17,c:DIM});
  s+=T(40,324,'Anstiegszeit '+fmt(v.tr,1)+' s',{s:17})+T(40,348,'Haltezeit '+fmt(v.th,0)+' s',{s:17});
  return s+'</svg>';
}
function diaEW(v){
  let s=`<svg viewBox="0 0 720 440" preserveAspectRatio="xMidYMid meet" xmlns="${NS}">${defs()}`;
  const gx=360, gy=220, R=62, r=34;
  // Zentralwelle
  s+=`<line x1="70" y1="${gy}" x2="610" y2="${gy}" stroke="#fff" stroke-width="9" opacity=".9"/>`+T(110,gy+34,'Zentralwelle',{s:16,c:DIM});
  // Nebenwellen + Motoren
  [[gy-(R+r),'Prüfmotor 1','Nebenwelle 1'],[gy+(R+r),'Prüfmotor 2','Nebenwelle 2']].forEach(([y,n,w],i)=>{
    s+=`<line x1="150" y1="${y}" x2="${gx}" y2="${y}" stroke="#fff" stroke-width="6" opacity=".9"/>`;
    s+=`<rect x="50" y="${y-30}" width="100" height="60" fill="#3c3c3f" stroke="#fff" stroke-width="3"/>`+T(100,y+6,n,{a:'middle',s:16});
    s+=T(250,y+(i?32:-14),w,{a:'middle',s:15,c:DIM});
    s+=`<path d="${gearPath(gx,y,r,r-9,12,i?0.1:0.3)}" fill="#545456" stroke="${OR}" stroke-width="3" stroke-linejoin="round"/><circle cx="${gx}" cy="${y}" r="5" fill="#fff"/>`;
  });
  s+=`<path d="${gearPath(gx,gy,R,R-11,22,0.14)}" fill="#545456" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="${gx}" cy="${gy}" r="9" fill="${OR}"/>`;
  
  // Gegenmotor / Last
  s+=`<rect x="580" y="${gy-34}" width="116" height="68" fill="#3c3c3f" stroke="#fff" stroke-width="3"/>`+T(638,gy-4,'Gegenmotor',{a:'middle',s:16})+T(638,gy+18,'(Last)',{a:'middle',s:15,c:DIM});
  s+=`<path d="M 470 ${gy-60} A 54 54 0 0 1 470 ${gy+60}" fill="none" stroke="${OR}" stroke-width="4" marker-end="url(#ao)"/>`;
  s+=T(500,gy-70,'Lastmoment',{c:OR,s:17})+T(500,gy-50,fmt(v.M,1)+' Nm',{c:OR,s:19,w:600});
  s+=T(60,404,'Beide Motoren laufen gekoppelt über die Zentralwelle · Laufzeit '+fmt(v.tl,0)+' min · × '+v.n,{s:16,c:DIM});
  return s+'</svg>';
}
function plantSchema(small){
  const L=lim();
  let s=`<svg viewBox="0 0 720 ${small?440:270}" preserveAspectRatio="xMidYMid meet" xmlns="${NS}">${defs()}`;
  const y=small?200:112;
  s+=`<rect x="30" y="${y-45}" width="150" height="90" fill="#3c3c3f" stroke="#fff" stroke-width="3"/>`+T(105,y-6,'Prüfmotor',{a:'middle',s:19})+T(105,y+20,fmt(plant.P.Mm,0)+' Nm max.',{a:'middle',s:15,c:DIM});
  s+=`<rect x="540" y="${y-45}" width="150" height="90" fill="#3c3c3f" stroke="#fff" stroke-width="3"/>`+T(615,y-6,'Gegenmotor',{a:'middle',s:19})+T(615,y+20,fmt(plant.G.Mm,0)+' Nm max.',{a:'middle',s:15,c:DIM});
  s+=`<line x1="180" y1="${y}" x2="540" y2="${y}" stroke="#fff" stroke-width="9" opacity=".9"/>`+T(360,y+(small?84:62),'Zentralwelle',{a:'middle',s:16,c:DIM});
  const stage=(x,o,lab)=>{ if(o.direct){ s+=`<rect x="${x-22}" y="${y-14}" width="44" height="28" fill="#545456" stroke="${OR}" stroke-width="3"/>`+T(x,y-26,'Kupplung',{a:'middle',s:14,c:DIM}); }
    else { s+=`<path d="${gearPath(x-20,y,34,25,14,0.2)}" fill="#545456" stroke="${OR}" stroke-width="3"/><path d="${gearPath(x+22,y,22,14,9,0.1)}" fill="#545456" stroke="#fff" stroke-width="3"/>`; }
    s+=T(x,y-58,'i = '+fmt(ratio(o),2),{a:'middle',s:19,c:OR,w:600}); };
  stage(262,plant.iP); stage(458,plant.iG);
  const yb=y+(small?130:100);
  s+=`<line x1="60" y1="${yb}" x2="660" y2="${yb}" stroke="${OR}" stroke-width="2" stroke-dasharray="6 5"/>`;
  s+=T(360,yb+28,'max. Lastmoment an der Zentralwelle: '+fmt(L.Mmax,1)+' Nm',{a:'middle',s:18,c:OR,w:600});
  return s+'</svg>';
}
